<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RT Digital - Portal Layanan Warga</title>

  <link rel="icon" type="image/png" href="icon-512.png">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Meta tags untuk PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RT Digital">
  
  <!-- SEO & Social Share -->
  <meta name="description" content="Portal Layanan & Keuangan Warga RT Digital">
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f8fafc;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f8fafc;
    }

    /* Loading screen sebelum iframe load */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #059669 0%, #0d9488 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: pulse 2s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .loading-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .loading-subtitle {
      font-size: 12px;
      opacity: 0.7;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
      </svg>
    </div>
    <div class="loading-title">RT Digital</div>
    <div class="loading-subtitle">Portal Layanan Warga</div>
    <div class="loading-spinner"></div>
  </div>

  <!-- App Wrapper -->
  <div class="app-wrapper">
    <iframe 
      id="appIframe"
      src="https://script.google.com/macros/s/AKfycbxJKgUwd5BJ--7hvY2jfLMmcwO-5UzuJxu93FmnZm7dlQaPgTEhfG6NaDsCLaiGA4KP/exec" 
      allow="fullscreen; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>
  
  <script>
    // ==========================================
    // HIDE LOADING SCREEN SETELAH IFRAME LOAD
    // ==========================================
    const iframe = document.getElementById('appIframe');
    const loadingScreen = document.getElementById('loadingScreen');

    iframe.addEventListener('load', function() {
      setTimeout(function() {
        loadingScreen.classList.add('hidden');
      }, 300);
    });

    // Fallback: hide loading after 8 detik (kalau load event tidak trigger)
    setTimeout(function() {
      loadingScreen.classList.add('hidden');
    }, 8000);

    // ==========================================
    // REGISTER SERVICE WORKER (untuk PWA)
    // ==========================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW terdaftar!', reg.scope))
          .catch(err => console.log('SW gagal!', err));
      });
    }

    // ==========================================
    // DETEKSI INSTALL PROMPT (PWA)
    // ==========================================
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA siap di-install');
    });

    window.addEventListener('appinstalled', () => {
      console.log('PWA berhasil di-install');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
